<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGON SHOW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            height: 100vh;
            color: #fff;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #0a1628 url("dragon_bg.png") center center / cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .top-header {
            flex-shrink: 0;
            position: relative;
        }

        .top-bar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px 8px;
            background:
                linear-gradient(180deg,
                    rgba(0, 110, 130, 0.55) 0%,
                    rgba(0, 65, 85, 0.72) 45%,
                    rgba(8, 35, 52, 0.88) 100%);
            box-shadow:
                inset 0 1px 0 rgba(120, 240, 255, 0.35),
                inset 0 -4px 14px rgba(0, 180, 210, 0.1),
                0 2px 12px rgba(0, 0, 0, 0.35);
        }

        .top-glow-down {
            position: relative;
            height: 22px;
            pointer-events: none;
            background: linear-gradient(180deg,
                rgba(120, 248, 255, 0.45) 0%,
                rgba(0, 229, 255, 0.2) 22%,
                rgba(0, 200, 230, 0.07) 55%,
                transparent 100%);
        }

        .top-glow-down::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(125, 244, 255, 0.4) 8%,
                #7df4ff 22%,
                #00e5ff 50%,
                #7df4ff 78%,
                rgba(125, 244, 255, 0.4) 92%,
                transparent 100%);
            box-shadow:
                0 0 8px rgba(125, 244, 255, 1),
                0 0 16px rgba(0, 229, 255, 0.75),
                0 0 28px rgba(0, 229, 255, 0.35),
                0 2px 10px rgba(0, 229, 255, 0.25);
        }

        .brand {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
        }

        .filters {
            display: flex;
            gap: 12px;
        }

        .filter-btn {
            border: none;
            border-radius: 999px;
            padding: 7px 22px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
        }

        .filter-btn.apps { background: #007bff; }
        .filter-btn.game { background: #28a745; }
        .filter-btn.apps.is-active {
            box-shadow:
                inset 0 0 0 2px #fff,
                0 0 14px rgba(255, 215, 0, 0.55);
        }
        .filter-btn.game.is-active {
            box-shadow:
                inset 0 0 0 2px #fff,
                0 0 14px rgba(40, 167, 69, 0.65);
        }
        .filter-btn:focus {
            outline: none;
            box-shadow: 0 0 0 2px #fff, 0 0 10px rgba(0, 180, 255, 0.45);
        }

        .main-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 0 8px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .columns {
            display: flex;
            gap: 0;
            min-height: min-content;
            align-items: stretch;
            padding: 0 16px;
        }

        .content-group {
            display: none;
        }

        .content-group.is-active {
            display: block;
        }

        .section {
            flex: 1;
            min-width: 0;
            padding: 12px var(--section-pad-x) 20px;
        }

        .section-divider {
            width: 2px;
            flex-shrink: 0;
            align-self: stretch;
            background: linear-gradient(180deg, transparent 0%, transparent 6%, rgba(0, 220, 255, 0.55) 18%, rgba(0, 220, 255, 0.55) 82%, transparent 100%);
            margin: 34px 0 20px;
        }

        .section-title {
            display: inline-block;
            margin: 0;
            padding: 4px 42px 6px;
            text-align: center;
            font-family: "Orbitron", "Arial Black", sans-serif;
            font-size: var(--section-title-size);
            font-weight: 800;
            color: #fff;
            letter-spacing: 1.5px;
            text-transform: none;
            line-height: 1.2;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(0, 55, 120, 0.4) 5%,
                rgba(0, 123, 255, 0.78) 22%,
                rgba(0, 123, 255, 0.78) 78%,
                rgba(0, 55, 120, 0.4) 95%,
                transparent 100%);
        }

        .section-head {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        :root {
            --card-cols: 3;
            --card-gap: 14px;
            --box-pad-y: 12px;
            --box-pad-x: 10px;
            --card-title-size: 14px;
            --btn-size: 12px;
            --btn-pad-y: 9px;
            --section-title-size: 20px;
            --section-pad-x: 14px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(var(--card-cols), minmax(0, 1fr));
            gap: var(--card-gap);
        }

        .box {
            position: relative;
            overflow: hidden;
            background-color: rgba(18, 28, 42, 0.92);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: clamp(12px, 1.5vw, 18px);
            padding: var(--box-pad-y) var(--box-pad-x) calc(var(--box-pad-y) + 2px);
            text-align: center;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .box::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(180deg,
                rgba(6, 14, 26, 0.35) 0%,
                rgba(6, 14, 26, 0.82) 55%,
                rgba(6, 14, 26, 0.92) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .box > * {
            position: relative;
            z-index: 1;
        }

        .box:focus,
        .box:focus-within {
            border-color: #00b4ff;
            transform: scale(1.03);
            outline: none;
            box-shadow: 0 0 18px rgba(0, 180, 255, 0.35);
        }

        .title-wrapper {
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 180, 255, 0.25);
        }

        .title-wrapper h2 {
            display: block;
            width: 100%;
            margin: 0;
            padding: 6px 8px 7px;
            font-size: var(--card-title-size);
            font-weight: 700;
            color: #4db8ff;
            line-height: 1.3;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(0, 55, 120, 0.42) 2%,
                rgba(0, 95, 115, 0.78) 14%,
                rgba(0, 95, 115, 0.78) 86%,
                rgba(0, 55, 120, 0.42) 98%,
                transparent 100%);
        }

        .btn-group {
            padding: 0 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 0 6px;
        }

        .btn {
            background: #007bff;
            color: #fff;
            border: none;
            padding: var(--btn-pad-y) 8px;
            border-radius: 12px;
            font-size: var(--btn-size);
            cursor: pointer;
            margin: 0 0 8px;
            width: 100%;
            font-weight: 700;
        }

        .btn-clean {
            background: #3a3f47;
            color: #e8e8e8;
            font-size: calc(var(--btn-size) - 1px);
            margin-bottom: 0;
        }

        .btn-details {
            width: 100%;
            margin-bottom: 8px;
        }

        .box-downloading .btn-details,
        .box-mode-2 .btn-details {
            display: none !important;
        }

        .btn-status {
            display: none;
            background: #3a3f47;
            font-size: calc(var(--btn-size) - 1px);
            margin-bottom: 0;
            width: 100%;
        }

        .btn-status.is-downloading {
            display: block;
            color: #ffd700;
        }

        .box-mode-2 .btn-status {
            display: none !important;
        }

        .btn:focus {
            background: #0056b3;
            outline: 2px solid #fff;
        }

        .btn-clean:focus { background: #555b65; }

        .btn-dl { width: 100%; }

        .mode-2-row {
            display: none !important;
            width: 100%;
            gap: 6px;
            margin-bottom: 8px;
            flex-direction: column;
        }

        .box-mode-2 .btn-dl {
            display: none !important;
        }

        .box-mode-2 .mode-2-row {
            display: flex !important;
            flex-direction: column;
            margin-top: 0;
        }

        .btn-cache {
            background: #8b2e2e;
            color: #fff;
            width: 100%;
            margin-bottom: 0;
        }

        .btn-cache:focus {
            background: #a83232;
            outline: none;
            box-shadow: 0 0 0 2px #fff;
        }

        .btn-install {
            background: #3a3f47;
            color: #aaa;
            width: 100%;
            margin-bottom: 0;
            font-size: calc(var(--btn-size) - 1px);
        }

        .btn-install.is-ready {
            background: #1a3d1a;
            color: #39ff14;
        }

        .btn-install.is-ready:focus {
            background: #245a24;
            outline: none;
            box-shadow: 0 0 0 2px #39ff14;
        }

        .btn-install.is-not-ready {
            background: #3a3f47;
            color: #aaa;
        }

        .progress-container {
            width: 100%;
            background: #333;
            height: 18px;
            border-radius: 10px;
            margin: 12px auto 0;
            display: none;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #007bff, #00d4ff);
            transition: width 0.2s ease;
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 2;
        }

        .footer {
            flex-shrink: 0;
            text-align: center;
            padding: 28px 12px 24px;
            margin-top: 8px;
            color: #888;
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        @keyframes move {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }

        /* مجموعة Game — نفس ألوان زر Game (#28a745) */
        #group-game .section-divider {
            background: linear-gradient(180deg, transparent 0%, transparent 6%, rgba(40, 167, 69, 0.55) 18%, rgba(40, 167, 69, 0.55) 82%, transparent 100%);
        }

        #group-game .section-title {
            color: #fff;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(15, 55, 28, 0.4) 5%,
                rgba(40, 167, 69, 0.78) 22%,
                rgba(40, 167, 69, 0.78) 78%,
                rgba(15, 55, 28, 0.4) 95%,
                transparent 100%);
        }

        #group-game .title-wrapper {
            border-bottom-color: rgba(40, 167, 69, 0.35);
        }

        #group-game .title-wrapper h2 {
            color: #5dd879;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(15, 55, 28, 0.42) 2%,
                rgba(20, 75, 38, 0.78) 14%,
                rgba(20, 75, 38, 0.78) 86%,
                rgba(15, 55, 28, 0.42) 98%,
                transparent 100%);
        }

        #group-game .box:focus,
        #group-game .box:focus-within,
        #group-game .box.tv-inside {
            border-color: #28a745;
            box-shadow: 0 0 18px rgba(40, 167, 69, 0.4);
        }

        #group-game .btn:not(.btn-clean):not(.btn-cache):not(.btn-install) {
            background: #28a745;
        }

        #group-game .btn:not(.btn-clean):not(.btn-cache):not(.btn-install):focus {
            background: #1e7e34;
        }

        #group-game .progress-bar {
            background: linear-gradient(90deg, #28a745, #5dd879);
        }

        /* تلفاز: شبكة كما كانت — لا تتأثر بإعدادات الموبايل */
        @media (min-width: 901px) {
            body {
                height: 100vh;
            }
            .cards-grid {
                display: grid;
                grid-template-columns: repeat(var(--card-cols), minmax(0, 1fr));
                overflow: visible;
                flex-direction: unset;
                flex-wrap: unset;
                scroll-snap-type: none;
                padding: 0;
            }
            .box {
                flex: unset;
                min-width: 0;
                max-width: none;
                scroll-snap-align: unset;
            }
            .box:focus,
            .box:focus-within {
                transform: none;
            }
            .filter-btn {
                border-radius: 10px;
            }
            .filter-btn:focus {
                outline: none;
                box-shadow:
                    inset 0 0 0 2px #fff,
                    0 0 12px rgba(0, 229, 255, 0.55);
            }
            .section-head {
                transition: opacity 0.25s ease, max-height 0.25s ease, margin-bottom 0.25s ease;
                max-height: 72px;
                overflow: hidden;
            }
            .section-head.tv-hidden {
                opacity: 0;
                max-height: 0;
                margin-bottom: 0 !important;
                visibility: hidden;
            }
            .box.tv-inside {
                border-color: #00b4ff;
                box-shadow: 0 0 18px rgba(0, 180, 255, 0.35);
            }
        }

        /* تلفاز / شاشات عريضة */
        @media (min-width: 1024px) and (min-height: 540px) {
            :root {
                --card-cols: 3;
                --card-gap: 16px;
                --box-pad-y: 14px;
                --box-pad-x: 12px;
                --card-title-size: 16px;
                --btn-size: 13px;
                --btn-pad-y: 10px;
                --section-title-size: 22px;
                --section-pad-x: 16px;
            }
        }

        @media (min-width: 1600px) and (min-height: 720px) {
            :root {
                --card-gap: 18px;
                --card-title-size: 17px;
                --btn-size: 14px;
                --section-title-size: 24px;
            }
        }

        /* تابلت / موبايل أفقي */
        @media (max-width: 1023px) {
            :root {
                --card-cols: 2;
                --card-gap: 12px;
                --section-title-size: 18px;
            }
        }

        @media (max-width: 900px) {
            .columns {
                flex-direction: column;
                padding: 0 12px;
            }
            .section-divider {
                width: auto;
                height: 2px;
                margin: 8px 20px;
                background: linear-gradient(90deg, transparent, rgba(0, 220, 255, 0.5), transparent);
            }
            #group-game .section-divider {
                background: linear-gradient(90deg, transparent, rgba(40, 167, 69, 0.5), transparent);
            }
            :root {
                --section-pad-x: 0;
            }

            /* أزرار Apps/Game: مربع بحواف منحنية + تركيز على شكل الزر */
            .filter-btn {
                border-radius: 10px;
                padding: 8px 18px;
            }
            .filter-btn:focus {
                outline: none;
                box-shadow:
                    inset 0 0 0 2px #fff,
                    0 0 12px rgba(0, 229, 255, 0.55);
            }

            .btn:focus,
            .btn-clean:focus {
                outline: none;
                box-shadow: inset 0 0 0 2px #fff;
            }

            .btn-install.is-ready:focus {
                outline: none;
                box-shadow: 0 0 0 2px #39ff14;
            }

            .btn-cache:focus {
                outline: none;
                box-shadow: 0 0 0 2px #fff;
            }

            #group-game .btn:not(.btn-clean):not(.btn-cache):not(.btn-install):focus {
                outline: none;
                box-shadow: inset 0 0 0 2px #fff;
            }

            /* البوكسات: تمرير أفقي يمين/يسار (ليس شبكة) */
            .cards-grid {
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                grid-template-columns: none;
                overflow-x: auto;
                overflow-y: hidden;
                gap: 12px;
                padding: 4px 4px 10px;
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior-x: contain;
                scrollbar-width: none;
            }
            .cards-grid::-webkit-scrollbar {
                display: none;
            }
            .box {
                flex: 0 0 min(78vw, 280px);
                min-width: 220px;
                scroll-snap-align: center;
            }
            .section {
                padding-bottom: 12px;
                min-height: 38vh;
            }
            .footer {
                padding: 32px 12px 28px;
            }
        }

        /* موبايل */
        @media (max-width: 640px) {
            :root {
                --card-gap: 10px;
                --box-pad-y: 10px;
                --box-pad-x: 8px;
                --card-title-size: 13px;
                --btn-size: 11px;
                --btn-pad-y: 8px;
                --section-title-size: 16px;
            }
            .brand { font-size: 18px; }
            .box {
                flex-basis: min(82vw, 260px);
                min-width: 200px;
            }
        }

        @media (max-width: 420px) {
            .box {
                flex-basis: min(88vw, 240px);
                min-width: 180px;
            }
        }

        /* ارتفاع قصير (موبايل أفقي / شاشات منخفضة) */
        @media (max-height: 520px) {
            :root {
                --card-gap: 8px;
                --box-pad-y: 8px;
                --box-pad-x: 8px;
                --btn-pad-y: 6px;
                --section-title-size: 15px;
            }
            .section-head { margin-bottom: 10px; }
            .title-wrapper { margin-bottom: 8px; padding-bottom: 6px; }
            .top-glow-down { height: 14px; }
        }

        @media (max-height: 520px) and (min-width: 901px) {
            :root {
                --card-cols: 4;
            }
        }

        /* تلفاز بعرض كبير وقسمين جنب بعض */
        @media (min-width: 1024px) and (max-width: 1399px) and (min-height: 540px) {
            :root {
                --card-cols: 2;
            }
        }
    </style>
</head>

        function saveBoxMode(boxKey, mode) {
            if (!boxKey) return;
            try {

            } catch (e) {}
        }

        function saveBoxProgress(boxKey, value) {
            if (!boxKey) return;
            try { localStorage.setItem("dlprogress_" + boxKey, String(value)); } catch (e) {}
        }

        function clearBoxProgress(boxKey) {
            if (!boxKey) return;
            try {
                localStorage.removeItem("dlprogress_" + boxKey);
                localStorage.removeItem("dlstate_" + boxKey);
            } catch (e) {}
        }

        function saveBoxDlState(boxKey, state) {
            if (!boxKey) return;
            try {
                if (state) localStorage.setItem("dlstate_" + boxKey, state);
                else localStorage.removeItem("dlstate_" + boxKey);
            } catch (e) {}
        }

        function getSavedProgress(boxKey) {
            try { return parseInt(localStorage.getItem("dlprogress_" + boxKey) || "0", 10) || 0; } catch (e) { return 0; }
        }

        function getSavedDlState(boxKey) {
            try { return localStorage.getItem("dlstate_" + boxKey) || ""; } catch (e) { return ""; }
        }

        function getAndroidProgress(boxKey) {
            if (!window.Android) return -1;
            var pollFn = window.Android.getDownloadProgressForBox || window.Android.getDownloadProgress;
            if (!pollFn) return -1;
            try {
                return Math.max(0, Math.min(100, parseInt(pollFn.call(window.Android, boxKey), 10) || 0));
            } catch (e) {
                return -1;
            }
        }

        function resumeProgressPolling(parentBox, boxKey) {
            if (progressPollers.has(parentBox)) {
                clearInterval(progressPollers.get(parentBox));
                progressPollers.delete(parentBox);
            }
            if (!window.Android) return;
            var pollFn = window.Android.getDownloadProgressForBox || window.Android.getDownloadProgress;
            if (!pollFn) return;
            var pollId = setInterval(function () {
                var pct = pollFn.call(window.Android, boxKey);
                window.setDownloadProgress(pct, boxKey);
                if (pct >= 100) {
                    clearInterval(pollId);
                    progressPollers.delete(parentBox);
                }
            }, 250);
            progressPollers.set(parentBox, pollId);
        }

        function restoreDownloadingBox(box, boxKey, progress) {
            if (!box || !boxKey) return;
            box.classList.remove("box-mode-2", "box-ready-install", "box-no-install");

            updateStatusButton(box, "downloading");
            resumeProgressPolling(box, boxKey);

        function restoreBoxModes(root) {
            var scope = root || document;
            var readyKeys = getReadyBoxKeys();
            scope.querySelectorAll(".box[data-dl-key]").forEach(function (box) {

                var saved = "";
                try { saved = localStorage.getItem("dlmode_" + boxKey) || ""; } catch (e) {}
                var progress = getSavedProgress(boxKey);
                var androidProgress = getAndroidProgress(boxKey);
                if (androidProgress >= 0 && androidProgress > progress) progress = androidProgress;
                var isDownloading = getSavedDlState(boxKey) === "downloading" ||
                    (progress > 0 && progress < 100) ||
                    (androidProgress >= 0 && androidProgress > 0 && androidProgress < 100);

                if (progress >= 100) {
                    var canInstall = saved !== "2-noinstall" && (saved === "2-ready" || readyKeys.indexOf(boxKey) >= 0);
                    enterMode2(box, canInstall);
                    return;
                }
                if (isDownloading) {
                    restoreDownloadingBox(box, boxKey, progress);
                    return;
                }
                if (saved === "2-ready") {
                    enterMode2(box, true);
                } else if (saved === "2-noinstall") {
                    enterMode2(box, false);
                }
            });
        }

        function enterMode2(box, canInstall) {
            if (!box) return;
            var boxKey = box.getAttribute("data-dl-key") || "";
            box.classList.remove("box-downloading");
            box.classList.add("box-mode-2");
            if (progressPollers.has(box)) {

            if (activeDownloadBox === box) activeDownloadBox = null;
            var progressCont = box.querySelector(".progress-container");
            var progressBar = box.querySelector(".progress-bar");
            var progressLabel = box.querySelector(".timer-text");
            if (progressCont) progressCont.style.display = "none";

            if (progressLabel) progressLabel.innerText = "0%";

            if (installBtn) {

                installBtn.classList.toggle("is-ready", canInstall);
                installBtn.classList.toggle("is-not-ready", !canInstall);
            }
            if (canInstall) {
                box.classList.add("box-ready-install");
                box.classList.remove("box-no-install");
                saveBoxMode(boxKey, "2-ready");

                saveBoxMode(boxKey, "2-noinstall");
            }
            saveBoxProgress(boxKey, 100);
            saveBoxDlState(boxKey, null);
            updateStatusButton(box, "idle");
        }

        function updateStatusButton(box, state) {
            var btn = box.querySelector(".btn-status");
            if (!btn || box.classList.contains("box-mode-2")) return;
            btn.classList.remove("is-downloading");
            if (state === "downloading") {
                btn.style.display = "block";
                btn.classList.add("is-downloading");
                btn.innerText = "تطبيق قيد تحميل";
            } else {
                btn.style.display = "none";
                btn.innerText = "";
            }
        }

        function installAction(btnElement) {
            var parentBox = btnElement.closest(".box");
            if (!parentBox || !parentBox.classList.contains("box-ready-install")) return;
            var boxKey = parentBox.getAttribute("data-dl-key") || "";
            if (window.Android && window.Android.installBoxDownload) {
                window.Android.installBoxDownload(boxKey);
            }
        }

        function applyProgressToBox(box, value) {
            if (!box) return;
            var boxKey = box.getAttribute("data-dl-key") || "";
            var last = parseInt(box.getAttribute("data-dl-progress") || "0", 10);
            if (value < last) value = last;
            box.setAttribute("data-dl-progress", String(value));
            if (boxKey) saveBoxProgress(boxKey, value);
            var progressCont = box.querySelector(".progress-container");
            var progressBar = box.querySelector(".progress-bar");
            var progressLabel = box.querySelector(".timer-text");
            if (progressCont) progressCont.style.display = "block";
            if (progressBar) progressBar.style.width = value + "%";
            if (progressLabel) progressLabel.innerText = value + "%";
            if (value >= 100) {
                enterMode2(box, true);
            } else if (value > 0 || box.classList.contains("box-downloading")) {
                updateStatusButton(box, "downloading");
            }
        }

        window.setDownloadProgress = function (percent, boxKey) {
            var raw = Math.max(0, Math.min(100, parseInt(percent, 10) || 0));
            var value = Math.floor(raw / 5) * 5;
            if (raw > 0 && value === 0) value = 5;
            if (raw >= 100) value = 100;
            var box = null;
            if (boxKey) {
                box = document.querySelector('.box[data-dl-key="' + boxKey + '"]');
            }
            if (!box && activeDownloadBox) {
                box = activeDownloadBox;
            }
            if (!box) {
                box = document.querySelector(".box.box-downloading");
            }
            if (!box) return;
            if (value >= 100) {
                applyProgressToBox(box, value);
                return;
            }
            if (!box.classList.contains("box-downloading")) return;
            applyProgressToBox(box, value);
        };
        let tvInsideBox = false;
        let tvActiveBox = null;
        let activeGroupName = "apps";

        function isMobileView() {
            return window.matchMedia("(max-width: 900px)").matches;
        }

        function isTvView() {
            return !isMobileView();
        }

        function scrollFocusIntoView(el) {
            if (!el) return;
            if (isMobileView()) {
                el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
                return;
            }
            var root = document.querySelector(".main-scroll");
            if (!root) {
                el.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
                return;
            }
            var pad = 20;
            var er = el.getBoundingClientRect();
            var sr = root.getBoundingClientRect();
            if (er.top < sr.top + pad) {
                root.scrollTop -= (sr.top + pad - er.top);
            } else if (er.bottom > sr.bottom - pad) {
                root.scrollTop += (er.bottom - sr.bottom + pad);
            }
            updateTvSectionHeads();
        }

        function getActiveGroup() {
            return document.querySelector(".content-group.is-active");
        }

        function getGroupByName(name) {
            return document.querySelector('.content-group[data-group="' + name + '"]');
        }

        function updateGroupFocusability() {
            document.querySelectorAll(".content-group").forEach(function (group) {
                var isActive = group.classList.contains("is-active");
                group.querySelectorAll(".box").forEach(function (box) {
                    box.tabIndex = isActive ? 0 : -1;
                });
            });
        }

        function switchGroup(name) {
            if (activeGroupName !== name) {
                activeGroupName = name;
                if (tvInsideBox) exitTvBox();

                document.querySelectorAll(".content-group").forEach(function (group) {
                    group.classList.toggle("is-active", group.dataset.group === name);
                });

                document.querySelectorAll(".filter-btn").forEach(function (btn) {
                    btn.classList.toggle("is-active", btn.dataset.group === name);
                });

                var mainScroll = document.querySelector(".main-scroll");
                if (mainScroll) mainScroll.scrollTop = 0;
            }

            updateGroupFocusability();
            setupTvFocusables();
            updateTvSectionHeads();
        }

        function activateGroupFromFilter(btn) {
            if (!btn || !btn.dataset.group) return;
            if (btn.dataset.group === "game") {
                initGameGroup();
            }
            switchGroup(btn.dataset.group);
        }

        function initGameGroup() {
            var appsGroup = document.getElementById("group-apps");
            var gameGroup = document.getElementById("group-game");
            if (!appsGroup || !gameGroup || gameGroup.children.length > 0) return;

            gameGroup.innerHTML = appsGroup.innerHTML;

            gameGroup.querySelectorAll(".box").forEach(function (box) {
                box.classList.remove("box-mode-2", "box-ready-install", "box-no-install", "box-downloading");
            });

            applyBoxMeta(gameGroup, "game");
            restoreBoxModes(gameGroup);

            gameGroup.querySelectorAll(".box").forEach(function (box) {
                box.tabIndex = -1;
            });
        }

        function updateTvSectionHeads() {
            if (!isTvView()) {
                document.querySelectorAll(".section-head").forEach(function (head) {
                    head.classList.remove("tv-hidden");
                });
                return;
            }
            var root = document.querySelector(".main-scroll");
            if (!root) return;
            var rootTop = root.getBoundingClientRect().top;
            var activeGroup = getActiveGroup();
            if (!activeGroup) return;
            activeGroup.querySelectorAll(".section").forEach(function (section) {
                var head = section.querySelector(".section-head");
                var firstBox = section.querySelector(".box");
                if (!head || !firstBox) return;
                if (firstBox.getBoundingClientRect().top <= rootTop + 10) {
                    head.classList.add("tv-hidden");
                } else {
                    head.classList.remove("tv-hidden");
                }
            });
        }

        function setupTvFocusables() {
            document.querySelectorAll(".box .btn").forEach(function (btn) {
                btn.tabIndex = isTvView() ? -1 : 0;
            });
        }

        function elementCenter(el) {
            var r = el.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }

        function getFocusBox() {
            var el = document.activeElement;
            if (!el) return null;
            return el.classList.contains("box") ? el : el.closest(".box");
        }

        function getTvBoxLevelTargets() {
            var filters = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));
            var group = getActiveGroup();
            var boxes = group
                ? Array.prototype.slice.call(group.querySelectorAll(".cards-grid .box"))
                : [];
            return filters.concat(boxes);
        }

        function moveSpatialFocus(direction, targets, current) {
            if (!current) return false;
            var cc = elementCenter(current);
            var best = null;
            var bestScore = Infinity;

            targets.forEach(function (el) {
                if (el === current) return;
                var ec = elementCenter(el);
                var dx = ec.x - cc.x;
                var dy = ec.y - cc.y;
                var ok = false;
                if (direction === "left" && dx < -24) ok = true;
                if (direction === "right" && dx > 24) ok = true;
                if (direction === "up" && dy < -24) ok = true;
                if (direction === "down" && dy > 24) ok = true;
                if (!ok) return;
                var primary = (direction === "left" || direction === "right") ? Math.abs(dx) : Math.abs(dy);
                var secondary = (direction === "left" || direction === "right") ? Math.abs(dy) : Math.abs(dx);
                var score = primary + secondary * 1.5;
                if (score < bestScore) {
                    bestScore = score;
                    best = el;
                }
            });

            if (best) {
                best.focus();
                scrollFocusIntoView(best);
                return true;
            }
            return false;
        }

        function enterTvBox(box) {
            if (!box) return;
            tvInsideBox = true;
            tvActiveBox = box;
            box.classList.add("tv-inside");
            var btns = box.querySelectorAll(".btn");
            btns.forEach(function (btn) { btn.tabIndex = 0; });
            var firstBtn = box.querySelector(".btn");
            if (firstBtn) firstBtn.focus();
            scrollFocusIntoView(box);
        }

        function exitTvBox() {
            if (!tvInsideBox) return;
            tvInsideBox = false;
            document.querySelectorAll(".box .btn").forEach(function (btn) {
                if (isTvView()) btn.tabIndex = -1;
            });
            if (tvActiveBox) {
                tvActiveBox.classList.remove("tv-inside");
                tvActiveBox.focus();
                scrollFocusIntoView(tvActiveBox);
            }
        }

        function isBackKey(e) {
            return e.key === "Escape" || e.key === "Backspace" || e.keyCode === 4;
        }

        function isEnterKey(e) {
            return e.key === "Enter" || e.keyCode === 13 || e.keyCode === 23;
        }

        function handleTvKeydown(e) {
            if (isMobileView()) return;

            if (isBackKey(e)) {
                if (tvInsideBox) {
                    exitTvBox();
                    e.preventDefault();
                }
                return;
            }

            if (isEnterKey(e) && !tvInsideBox) {
                var active = document.activeElement;
                if (active && active.classList.contains("filter-btn")) {
                    activateGroupFromFilter(active);
                    var group = getActiveGroup();
                    var firstBox = group ? group.querySelector(".cards-grid .box") : null;
                    if (firstBox) firstBox.focus();
                    e.preventDefault();
                    return;
                }
                if (active && active.classList.contains("box")) {
                    enterTvBox(active);
                    e.preventDefault();
                    return;
                }
            }

            var dirMap = {
                ArrowLeft: "left",
                ArrowRight: "right",
                ArrowUp: "up",
                ArrowDown: "down"
            };
            var dir = dirMap[e.key];
            if (!dir) return;

            if (tvInsideBox) {
                var box = tvActiveBox || getFocusBox();
                var active = document.activeElement;
                if (!box) return;

                if (dir === "left" || dir === "right") {
                    exitTvBox();
                    e.preventDefault();
                    return;
                }

                if (active && active.classList.contains("btn")) {
                    var btns = Array.prototype.slice.call(box.querySelectorAll(".btn"));
                    var btnIndex = btns.indexOf(active);
                    if (dir === "down" && btnIndex < btns.length - 1) {
                        btns[btnIndex + 1].focus();
                        scrollFocusIntoView(box);
                        e.preventDefault();
                        return;
                    }
                    if (dir === "up" && btnIndex > 0) {
                        btns[btnIndex - 1].focus();
                        scrollFocusIntoView(box);
                        e.preventDefault();
                        return;
                    }
                }
                return;
            }

            var activeEl = document.activeElement;
            if (activeEl && activeEl.classList.contains("btn")) {
                activeEl = activeEl.closest(".box") || activeEl;
            }
            if (activeEl && !getTvBoxLevelTargets().includes(activeEl)) {
                activeEl = getFocusBox() || activeEl;
            }

            if (moveSpatialFocus(dir, getTvBoxLevelTargets(), activeEl)) {
                e.preventDefault();
            }
        }

        function cacheDeleteAction(btnElement) {
            var parentBox = btnElement.closest(".box");
            if (!parentBox) return;
            var boxKey = parentBox.getAttribute("data-dl-key") || "";

            if (window.Android && window.Android.cancelBoxDownload) {
                window.Android.cancelBoxDownload(boxKey);
            }

            exitMode1(parentBox);
        }

        function startAction(btnElement, url) {
            var parentBox = btnElement.closest(".box");
            var progressCont = parentBox.querySelector(".progress-container");
            var progressBar = parentBox.querySelector(".progress-bar");
            var progressLabel = parentBox.querySelector(".timer-text");

            if (progressPollers.has(parentBox)) {
                clearInterval(progressPollers.get(parentBox));
                progressPollers.delete(parentBox);
            }

            var boxKey = parentBox.getAttribute("data-dl-key") || "";
            parentBox.classList.remove("box-mode-2", "box-ready-install", "box-no-install");
            saveBoxMode(boxKey, null);
            clearBoxProgress(boxKey);
            parentBox.classList.add("box-downloading");
            activeDownloadBox = parentBox;
            saveBoxDlState(boxKey, "downloading");

            progressCont.style.display = "block";
            btnElement.innerText = "إعادة التحميل !";
            if (progressBar) progressBar.style.width = "0%";
            if (progressLabel) progressLabel.innerText = "0%";
            parentBox.setAttribute("data-dl-progress", "0");
            saveBoxProgress(boxKey, 0);
            updateStatusButton(parentBox, "downloading");

            if (window.Android && window.Android.triggerDownload) {
                window.Android.triggerDownload(url, boxKey);
                resumeProgressPolling(parentBox, boxKey);
            }
        }

        function resetBox(boxElement) {
            document.querySelectorAll(".box").forEach(function (box) {
                if (box !== boxElement && !box.classList.contains("box-downloading") && !box.classList.contains("box-mode-2")) {
                    var progressCont = box.querySelector(".progress-container");
                    var btn = box.querySelector(".btn");
                    var progressLabel = box.querySelector(".timer-text");
                    var progressBar = box.querySelector(".progress-bar");

                    if (progressCont) progressCont.style.display = "none";
                    if (btn && btn.innerText === "إعادة التحميل !") btn.innerText = "تحميل التطبيق";

                    if (progressPollers.has(box)) {
                        clearInterval(progressPollers.get(box));
                        progressPollers.delete(box);
                    }
                    if (progressLabel) progressLabel.innerText = "0%";
                    if (progressBar) progressBar.style.width = "0%";
                    box.removeAttribute("data-dl-progress");
                }
            });

            if (window.matchMedia("(max-width: 900px)").matches) {
                boxElement.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
            } else {
                scrollFocusIntoView(boxElement);
            }
        }

        function bootstrapStore() {
            applyBoxMeta(document.getElementById("group-apps"), "apps");
            initGameGroup();
            restoreBoxModes(document);
            updateGroupFocusability();
        }

        setupTvFocusables();
        bootstrapStore();

        document.querySelectorAll(".filter-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
                activateGroupFromFilter(btn);
            });
            btn.addEventListener("focus", function () {
                if (isTvView()) scrollFocusIntoView(btn);
            });
        });

        window.addEventListener("resize", function () {
            if (tvInsideBox && !isTvView()) {
                tvInsideBox = false;
                tvActiveBox = null;
                document.querySelectorAll(".box").forEach(function (box) {
                    box.classList.remove("tv-inside");
                });
            }
            setupTvFocusables();
            updateTvSectionHeads();
        });
        document.addEventListener("keydown", handleTvKeydown);

        var mainScrollEl = document.querySelector(".main-scroll");
        if (mainScrollEl) {
            mainScrollEl.addEventListener("scroll", updateTvSectionHeads);
        }

        window.addEventListener("load", function () {
            applyBoxMeta(document.getElementById("group-apps"), "apps");
            initGameGroup();
            try { restoreBoxModes(document); } catch (e) {}
            setupTvFocusables();
            updateGroupFocusability();
            updateTvSectionHeads();
            if (isTvView()) {
                var firstBox = getActiveGroup();
                firstBox = firstBox ? firstBox.querySelector(".cards-grid .box") : null;
                if (firstBox) firstBox.focus();
            }
        });

        window.addEventListener("pageshow", function () {
            try { restoreBoxModes(document); } catch (e) {}
        });

        document.querySelector(".main-scroll").addEventListener("focusin", function (e) {
            var box = e.target.closest ? e.target.closest(".box") : null;
            if (!box) return;
            var group = box.closest(".content-group");
            if (!group || !group.classList.contains("is-active")) return;
            if (isTvView() && !tvInsideBox) {
                scrollFocusIntoView(box);
            } else if (isMobileView()) {
                scrollFocusIntoView(box);
            }
        });

        document.querySelectorAll(".cards-grid").forEach(function (grid) {
            grid.addEventListener("wheel", function (e) {
                if (!window.matchMedia("(max-width: 900px)").matches) return;
                if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
                grid.scrollLeft += e.deltaY;
                e.preventDefault();
            }, { passive: false });
        });
    </script>
</body>
</html>
